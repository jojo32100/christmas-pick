<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎄 Secret Santa · Premium Color Envelopes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--red:#b81f2b;--green:#1f6b3a;--gold:#b8860b;--blue:#1e5b8a}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1200px 800px at 10% -10%, #0f3d27 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 110%, #2a0d0d 0%, transparent 55%),
      linear-gradient(160deg, #04140c 0%, #0a2518 40%, #071a12 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:2rem 1rem;color:#1a1a1a;position:relative;overflow-x:hidden;
  }

  /* ── falling snow ── */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 22%, #fff9 0, transparent 100%),
      radial-gradient(2px 2px at 78% 33%, #fff8 0, transparent 100%),
      radial-gradient(1.4px 1.4px at 42% 72%, #fff8 0, transparent 100%),
      radial-gradient(2.2px 2.2px at 88% 82%, #fff7 0, transparent 100%),
      radial-gradient(1.6px 1.6px at 55% 12%, #fff8 0, transparent 100%),
      radial-gradient(1.4px 1.4px at 25% 88%, #fff7 0, transparent 100%),
      radial-gradient(2px 2px at 68% 58%, #fff6 0, transparent 100%);
    background-size:340px 340px;
    animation:snowDrift 24s linear infinite;opacity:.55;z-index:0;
  }
  @keyframes snowDrift{100%{background-position:60px 340px,-40px 340px,30px 340px,-20px 340px,50px 340px,-50px 340px,20px 340px}}

  /* ── firework canvas behind everything ── */
  #fireworks{
    position:fixed;inset:0;z-index:1;pointer-events:none;
  }

  /* ── floating decorations ── */
  .floaters{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .floaters span{
    position:absolute;font-size:1.6rem;opacity:.35;
    animation:floatY linear infinite;
    filter:drop-shadow(0 0 8px rgba(255,220,150,.4));
  }
  @keyframes floatY{
    0%{transform:translateY(110vh) rotate(0deg);opacity:0}
    10%{opacity:.45}
    90%{opacity:.35}
    100%{transform:translateY(-15vh) rotate(360deg);opacity:0}
  }

  .stage{
    position:relative;z-index:2;width:100%;max-width:1000px;border-radius:34px;
    padding:2.6rem 2.2rem 2.4rem;
    background:radial-gradient(120% 120% at 50% 0%, #fffdf7 0%, #fdf3e3 45%, #f4e4c9 100%);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 1px rgba(212,175,55,.55),
      0 0 0 10px rgba(255,250,240,.06),0 0 0 11px rgba(212,175,55,.35),
      inset 0 1px 0 #fff,inset 0 -30px 60px rgba(184,134,11,.10);
    animation:stageIn .9s cubic-bezier(.2,.9,.2,1.05) both;
  }
  @keyframes stageIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  .stage::before{content:"";position:absolute;inset:14px;border-radius:24px;border:1px solid rgba(184,134,11,.35);pointer-events:none}
  .stage::after{
    content:"❋";position:absolute;top:18px;right:26px;font-size:1.4rem;color:#b8860b;opacity:.5;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.3;transform:scale(1) rotate(0)}50%{opacity:.9;transform:scale(1.25) rotate(180deg)}}

  header{text-align:center;margin-bottom:1.6rem;position:relative;z-index:2}
  .eyebrow{
    display:inline-block;font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;
    color:#8a6d2f;background:linear-gradient(180deg,#fff9ea,#f1e0bd);
    padding:.5rem 1.1rem;border-radius:999px;border:1px solid rgba(184,134,11,.4);
    box-shadow:inset 0 1px 0 #fff, 0 4px 14px rgba(184,134,11,.18);
    margin-bottom:1rem;font-weight:600;
    animation:eyebrowPulse 4s ease-in-out infinite;
  }
  @keyframes eyebrowPulse{0%,100%{box-shadow:inset 0 1px 0 #fff, 0 4px 14px rgba(184,134,11,.18)}50%{box-shadow:inset 0 1px 0 #fff, 0 4px 22px rgba(184,134,11,.45)}}

  h1{
    font-family:'Playfair Display',serif;font-weight:800;
    font-size:clamp(2rem,4.6vw,3.2rem);line-height:1.05;color:#7a1220;
    text-shadow:0 1px 0 #fff,0 2px 0 #f7e3b4,0 14px 26px rgba(122,18,32,.18);
    display:flex;align-items:center;justify-content:center;gap:.7rem;
  }
  h1 .tag{font-size:clamp(1.4rem,3.4vw,2.2rem);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));animation:bob 4.5s ease-in-out infinite}
  h1 .tag:nth-child(3){animation-delay:.8s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}

  .lede{margin-top:.6rem;font-size:.98rem;color:#4c3f2c;font-weight:500;max-width:600px;margin-inline:auto;line-height:1.5}

  .tracker{display:flex;justify-content:center;gap:.6rem;margin:1.2rem 0 .4rem;flex-wrap:wrap}
  .pip{width:9px;height:9px;border-radius:50%;background:rgba(184,134,11,.25);transition:all .4s cubic-bezier(.2,.9,.2,1.1);box-shadow:inset 0 0 0 1px rgba(184,134,11,.4)}
  .pip.filled{background:var(--red);box-shadow:0 0 0 3px rgba(184,31,43,.15),0 0 10px rgba(184,31,43,.5);transform:scale(1.15)}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem;margin:1.6rem 0 1.6rem;perspective:1400px}
  @media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr);gap:1.2rem}}
  @media (max-width:420px){.grid{gap:.9rem}}

  .env{position:relative;cursor:pointer;border:none;background:none;padding:0;transform-style:preserve-3d;outline:none;-webkit-tap-highlight-color:transparent;animation:envIn .7s cubic-bezier(.2,.9,.2,1.1) both}
  .env:nth-child(1){animation-delay:.05s}.env:nth-child(2){animation-delay:.15s}
  .env:nth-child(3){animation-delay:.25s}.env:nth-child(4){animation-delay:.35s}
  @keyframes envIn{from{opacity:0;transform:translateY(40px) rotateX(-15deg) scale(.9)}to{opacity:1;transform:translateY(0) rotateX(0) scale(1)}}

  .env-inner{
    position:relative;width:100%;aspect-ratio:1/1.18;border-radius:18px;
    background:linear-gradient(160deg,#fffdf7 0%,#f6ecd8 100%);
    box-shadow:0 22px 30px -18px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.9),
      0 0 0 4px var(--c),0 0 0 8px rgba(255,253,247,.9),0 0 0 9px rgba(0,0,0,.06);
    transition:transform .45s cubic-bezier(.2,.9,.2,1.1),box-shadow .35s,filter .5s;
    overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 1rem;
  }
  .env-inner::before{
    content:"";position:absolute;top:0;left:0;right:0;height:58%;
    background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(0,0,0,.12)),var(--c);
    clip-path:polygon(0 0,100% 0,50% 100%);filter:saturate(1.05);z-index:1;
    transition:transform .5s cubic-bezier(.2,.9,.2,1.1);transform-origin:top center;
  }
  .env-inner::after{
    content:"";position:absolute;inset:0;z-index:0;
    background:
      linear-gradient(135deg,transparent 49.6%,rgba(184,134,11,.18) 49.6% 50.4%,transparent 50.4%),
      linear-gradient(-135deg,transparent 49.6%,rgba(184,134,11,.18) 49.6% 50.4%,transparent 50.4%);
    opacity:.9;pointer-events:none;
  }
  .seal{
    position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
    width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 32% 30%,#fff6da 0%,#e6c87a 35%,#b8860b 100%);
    box-shadow:0 6px 14px rgba(0,0,0,.35),0 0 0 3px rgba(255,253,247,.95),
      0 0 0 5px rgba(184,134,11,.5),inset 0 1px 3px rgba(255,255,255,.8);
    z-index:3;transition:transform .5s cubic-bezier(.2,.9,.2,1.1),opacity .4s;
  }
  .seal::after{content:"✦";color:#7a1220;font-size:1.1rem;line-height:1;text-shadow:0 1px 0 #fff5c8}
  .label{
    position:relative;z-index:4;width:78%;text-align:center;font-size:.7rem;
    letter-spacing:.24em;text-transform:uppercase;color:#6b5424;font-weight:700;
    padding:.35rem 0 .1rem;border-top:1px solid rgba(184,134,11,.35);
  }
  .label b{display:block;font-size:.62rem;letter-spacing:.3em;color:#8a6d2f;font-weight:600;margin-top:.15rem}

  .env:not(.taken):not(.locked):hover .env-inner{
    transform:translateY(-10px) rotateX(4deg);
    box-shadow:0 34px 44px -20px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.95),
      0 0 0 4px var(--c),0 0 0 8px rgba(255,253,247,.95),0 0 0 9px rgba(0,0,0,.08);
  }
  .env:not(.taken):not(.locked):hover .seal{transform:translate(-50%,-50%) scale(1.1) rotate(6deg)}
  .env.opened .env-inner::before{transform:rotateX(180deg) translateY(-1px);filter:brightness(.9) saturate(1.15)}
  .env.opened .seal{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-30deg)}
  .env.opened .name-card{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg)}

  .env.taken{cursor:default;pointer-events:none}
  .env.taken .env-inner{
    filter:grayscale(1) brightness(.92) contrast(.9);opacity:.42;transform:translateY(0) scale(.94);
    box-shadow:0 12px 20px -14px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.8),
      0 0 0 4px #9a9a9a,0 0 0 8px rgba(255,253,247,.85),0 0 0 9px rgba(0,0,0,.05);
  }
  .env.taken .env-inner::before{filter:grayscale(1) brightness(.8)}
  .env.taken .seal{opacity:0}
  .env.taken .label{color:#8a8a8a;border-top-color:rgba(0,0,0,.1)}
  .env.taken .label b{color:#9a9a9a}

  .taken-ribbon{
    position:absolute;top:50%;left:50%;z-index:6;
    transform:translate(-50%,-50%) rotate(-12deg) scale(.5);opacity:0;
    background:linear-gradient(135deg,#3a3a3a,#1a1a1a);color:#f5e6c8;
    font-size:.62rem;font-weight:800;letter-spacing:.24em;
    padding:.4rem 1rem;border-radius:4px;border:1px solid rgba(245,230,200,.3);
    box-shadow:0 6px 16px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;
    transition:opacity .45s .15s,transform .55s cubic-bezier(.2,.9,.2,1.3) .15s;
  }
  .env.taken .taken-ribbon{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}

  .name-card{
    position:absolute;top:50%;left:50%;z-index:5;
    transform:translate(-50%,-30%) scale(.6) rotate(-6deg);opacity:0;
    background:linear-gradient(170deg,#fffdf6,#f7ecd6);border-radius:14px;
    padding:1rem 1.4rem;min-width:78%;text-align:center;
    box-shadow:0 20px 30px -10px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.9),
      0 0 0 3px var(--c),inset 0 1px 0 #fff;
    transition:transform .55s cubic-bezier(.2,.9,.2,1.2),opacity .4s ease;pointer-events:none;
  }
  .name-card .n{
    display:block;font-family:'Playfair Display',serif;font-weight:800;
    font-size:clamp(1.1rem,2.3vw,1.5rem);color:#7a1220;letter-spacing:.02em;
    text-shadow:0 1px 0 #fff,0 6px 14px rgba(122,18,32,.15);word-break:break-word;
  }
  .name-card .s{display:block;margin-top:.3rem;font-size:.58rem;letter-spacing:.32em;text-transform:uppercase;color:#8a6d2f;font-weight:700}

  .env[data-c="red"]{--c:var(--red)}.env[data-c="green"]{--c:var(--green)}
  .env[data-c="gold"]{--c:var(--gold)}.env[data-c="blue"]{--c:var(--blue)}

  .controls{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;margin-top:.6rem}
  .btn{
    appearance:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;
    font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;
    padding:1rem 1.8rem;border-radius:999px;display:inline-flex;align-items:center;gap:.6rem;
    transition:transform .12s ease,box-shadow .2s,filter .2s,opacity .3s;position:relative;overflow:hidden;
  }
  .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);transition:transform .7s}
  .btn:hover::after{transform:translateX(100%)}
  .btn-primary{
    color:#fff7ea;background:linear-gradient(160deg,#c0262f,#7a1220);
    box-shadow:0 10px 0 -2px #4d0a13,0 16px 26px -8px rgba(122,18,32,.6),inset 0 1px 0 rgba(255,255,255,.25);
    border:1px solid rgba(230,180,80,.6);
  }
  .btn-primary:active{transform:translateY(5px);box-shadow:0 4px 0 -2px #4d0a13,0 10px 20px -8px rgba(122,18,32,.6)}
  .btn-primary:disabled{filter:grayscale(.4) brightness(.9);cursor:not-allowed;opacity:.7;transform:none}

  .status{
    margin-top:1.6rem;text-align:center;font-size:.9rem;color:#5a4a2e;min-height:3.2rem;
    display:flex;align-items:center;justify-content:center;gap:.6rem;
    padding:.8rem 1.2rem;border-radius:14px;
    background:linear-gradient(180deg,rgba(255,250,240,.7),rgba(241,224,189,.5));
    border:1px solid rgba(184,134,11,.3);box-shadow:inset 0 1px 0 #fff;
    font-weight:600;letter-spacing:.02em;transition:all .35s;
  }
  .status.flash{animation:statusFlash .6s ease}
  @keyframes statusFlash{
    0%{background:linear-gradient(180deg,rgba(255,230,180,.9),rgba(241,200,120,.7));transform:scale(1.02)}
    100%{background:linear-gradient(180deg,rgba(255,250,240,.7),rgba(241,224,189,.5));transform:scale(1)}
  }
  .status .ico{font-size:1.2rem}

  .foot{margin-top:1rem;text-align:center;font-size:.64rem;letter-spacing:.34em;text-transform:uppercase;color:#9e8e72;opacity:.9}

  .confetti{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:50;animation:confFall linear forwards}
  @keyframes confFall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}

  /* ── golden glow pulse when a name is revealed ── */
  .golden-glow{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(circle at center, rgba(255,215,100,.28) 0%, transparent 60%);
    opacity:0;animation:goldenPulse 1.4s ease-out forwards;
  }
  @keyframes goldenPulse{
    0%{opacity:0;transform:scale(.7)}
    30%{opacity:1}
    100%{opacity:0;transform:scale(1.4)}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    #fireworks,.floaters{display:none}
  }
</style>
</head>
<body>

<!-- ═══ Christmas vibe layer ═══ -->
<canvas id="fireworks" aria-hidden="true"></canvas>
<div class="floaters" id="floaters" aria-hidden="true"></div>

<main class="stage" role="main" aria-label="Secret Santa envelope picker">
  <header>
    <span class="eyebrow">Season&nbsp;·&nbsp;Secret&nbsp;Santa</span>
    <h1><span class="tag">🎄</span> Pick Your Envelope <span class="tag">🎁</span></h1>
    <p class="lede">Four envelopes. Four names. Nobody — not even you — knows who’s inside. Tap an envelope to reveal your Secret Santa. Once picked, it’s out of the game — for everyone.</p>
  </header>

  <div class="tracker" id="tracker" aria-hidden="true">
    <span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="controls">
    <button class="btn btn-primary" id="reshuffle">🎲 Reshuffle Names</button>
  </div>

  <div class="status" id="status">
    <span class="ico">⏳</span><span id="statusText">Connecting to the party…</span>
  </div>

  <p class="foot">❄️ Merry Christmas &amp; Happy Secret Santa ❄️</p>
</main>

<script type="module">
/* ═══════════════════════════════════════════════════════════════
   FIREWORKS  +  FLOATING CHRISTMAS DECORATIONS
   (runs independently of the game logic)
   ═══════════════════════════════════════════════════════════════ */
(function fireworkLayer(){
  const canvas = document.getElementById('fireworks');
  const ctx    = canvas.getContext('2d');
  let W, H;
  function resize(){
    W = canvas.width  = window.innerWidth  * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width  = window.innerWidth  + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const palette = ['#ffd966','#ff6b6b','#fff7ea','#e6c87a','#7ed957','#5bc0eb','#f5a623','#ff9ecd'];

  function launchFirework(x, y, opts = {}){
    const count  = opts.count  ?? (22 + Math.floor(Math.random()*18));
    const colors = opts.colors ?? palette;
    const color  = colors[Math.floor(Math.random()*colors.length)];
    const speed  = opts.speed  ?? (2.2 + Math.random()*2.4);
    const life   = opts.life   ?? (60 + Math.random()*30);

    for(let i=0;i<count;i++){
      const angle = (Math.PI*2 * i) / count + (Math.random()*.4 - .2);
      const vel   = speed * (0.6 + Math.random()*0.6);
      particles.push({
        x, y,
        vx: Math.cos(angle)*vel,
        vy: Math.sin(angle)*vel,
        life,
        maxLife: life,
        color: Math.random() > .75 ? colors[(Math.random()*colors.length)|0] : color,
        size: 1.5 + Math.random()*1.8,
        gravity: 0.035 + Math.random()*0.02,
        drag: 0.985
      });
    }
  }

  // small trailing sparkle from particle
  function sparkle(x, y, color){
    particles.push({
      x, y,
      vx: (Math.random()-.5)*0.6,
      vy: (Math.random()-.5)*0.6,
      life: 20, maxLife: 20,
      color, size: 1 + Math.random()*1.2,
      gravity: 0.01, drag: 0.98, isSpark:true
    });
  }

  function tick(){
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.vy += p.gravity;
      p.x  += p.vx;
      p.y  += p.vy;
      p.life--;

      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.isSpark ? 0.8 : 1), 0, Math.PI*2);
      ctx.fill();

      // occasional trailing spark
      if(!p.isSpark && Math.random() > 0.86 && p.life > 6){
        sparkle(p.x, p.y, p.color);
      }

      if(p.life <= 0) particles.splice(i,1);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ambient random fireworks every few seconds
  function ambient(){
    const x = window.innerWidth  * (0.15 + Math.random()*0.7);
    const y = window.innerHeight * (0.10 + Math.random()*0.35);
    launchFirework(x, y, {count: 18 + (Math.random()*14)|0});
    setTimeout(ambient, 2800 + Math.random()*3800);
  }
  ambient();

  // expose a public burst so the game can call it
  window.ChristmasFX = {
    bigBurst(cx, cy){
      // center of screen — three overlapping fireworks
      launchFirework(cx, cy, {count: 46, speed: 3.2, life: 100});
      setTimeout(()=> launchFirework(cx-60, cy-20, {count: 38, speed: 2.8, life: 90, colors:['#ffd966','#ff6b6b','#fff7ea']}), 120);
      setTimeout(()=> launchFirework(cx+70, cy+10, {count: 38, speed: 3.0, life: 90, colors:['#7ed957','#5bc0eb','#ff9ecd']}), 240);
    },
    popAt(el){
      const r = el.getBoundingClientRect();
      launchFirework(r.left + r.width/2, r.top + r.height/2, {count: 34, speed: 2.6});
    },
    finale(){
      // massive multi-burst across the screen
      for(let k=0;k<8;k++){
        setTimeout(()=>{
          launchFirework(
            window.innerWidth  * (0.1 + Math.random()*0.8),
            window.innerHeight * (0.1 + Math.random()*0.5),
            {count: 40 + (Math.random()*30)|0, speed: 3.4, life: 110}
          );
        }, k*260);
      }
    }
  };
})();

/* ── floating Christmas glyphs rising through the background ── */
(function floaters(){
  const container = document.getElementById('floaters');
  const glyphs = ['🎄','❄️','⭐','🎁','🔔','✨','🎅','🕯️','⛄'];
  const N = 14;
  for(let i=0;i<N;i++){
    const s = document.createElement('span');
    s.textContent = glyphs[(Math.random()*glyphs.length)|0];
    s.style.left = (Math.random()*100) + '%';
    s.style.fontSize = (1 + Math.random()*1.6) + 'rem';
    s.style.animationDuration = (18 + Math.random()*22) + 's';
    s.style.animationDelay = (-Math.random()*30) + 's';
    container.appendChild(s);
  }
})();

/* ═══════════════════════════════════════════════════════════════
   SECRET SANTA GAME  (Firebase-backed, unchanged behaviour)
   ═══════════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyB3rAFwJuzBIx5GhtswuQHS___uq4onsE4",
  authDomain: "secret-santa-game-841c3.firebaseapp.com",
  databaseURL: "https://secret-santa-game-841c3-default-rtdb.firebaseio.com/",
  projectId: "secret-santa-game-841c3",
  storageBucket: "secret-santa-game-841c3.firebasestorage.app",
  appId: "1:948921738899:web:5b8c8afe6d23d28bfecf66",
  measurementId: "G-N8K7RG991Z"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, onValue, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const NAMES = ["Yemisi", "Tracy", "Benita", "Joses"];
const PALETTE = [
  {id:"red",   label:"Ruby Red",   hex:"#b81f2b"},
  {id:"green", label:"Pine Green", hex:"#1f6b3a"},
  {id:"gold",  label:"Gold",       hex:"#b8860b"},
  {id:"blue",  label:"Midnight",   hex:"#1e5b8a"}
];
const GAME_KEY = "secretSanta2024v22";

const grid       = document.getElementById('grid');
const statusText = document.getElementById('statusText');
const statusBox  = document.getElementById('status');
const btnShuffle = document.getElementById('reshuffle');
const pips       = document.querySelectorAll('.pip');

let state = {
  mapping: [null,null,null,null],
  taken:   [false,false,false,false],
  opened:  [false,false,false,false],
  names:   NAMES.slice()
};

function shuffle(a){
  const x = a.slice();
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
}
function buildMapping(available, taken){
  const freeIdx = [];
  for(let i=0;i<4;i++) if(!taken[i]) freeIdx.push(i);
  if(freeIdx.length === 0) return [null,null,null,null];

  const pool = available.slice();
  let tries = 0, shuffled;
  const isOkay = arr => arr.every((n,k)=> n !== NAMES[freeIdx[k]]);
  do { shuffled = shuffle(pool); tries++; } while(!isOkay(shuffled) && tries < 100);

  const m = [null,null,null,null];
  freeIdx.forEach((idx,k)=>{ m[idx] = shuffled[k]; });
  return m;
}
function updateTracker(){
  const count = state.taken.filter(Boolean).length;
  pips.forEach((p,i)=> p.classList.toggle('filled', i < count));
}
function setStatus(msg, flash){
  statusText.textContent = msg;
  if(flash){ statusBox.classList.remove('flash'); void statusBox.offsetWidth; statusBox.classList.add('flash'); }
}

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const gameRef = ref(db, GAME_KEY);

async function seedIfEmpty(){
  await runTransaction(gameRef, (current) => {
    if(current === null){
      const avail = NAMES.slice();
      const taken = [false,false,false,false];
      const map   = buildMapping(avail, taken);
      return {
        mapping: map,
        taken:   taken,
        opened:  [false,false,false,false],
        names:   avail
      };
    }
    return current;
  });
}

function render(){
  grid.innerHTML = '';
  PALETTE.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className = 'env';
    btn.type = 'button';
    btn.dataset.c = p.id;
    btn.dataset.index = i;

    const isTaken  = state.taken[i];
    const isOpened = state.opened[i];

    btn.innerHTML = `
      <div class="env-inner">
        <span class="seal" aria-hidden="true"></span>
        <span class="label">${p.label}<b>${isTaken ? "picked" : "tap to open"}</b></span>
      </div>
      <div class="name-card" aria-hidden="true">
        <span class="n"></span>
        <span class="s">Secret Santa</span>
      </div>
      <div class="taken-ribbon">TAKEN</div>
    `;

    if(isOpened){
      btn.classList.add('opened');
      const card = btn.querySelector('.name-card');
      card.querySelector('.n').textContent = state.mapping[i] || '';
      card.setAttribute('aria-hidden','false');
    }
    if(isTaken){
      btn.classList.add('taken');
      btn.setAttribute('aria-disabled','true');
      btn.setAttribute('aria-label', `${p.label} — already taken`);
    }

    btn.addEventListener('click', ()=> onPick(i, btn));
    grid.appendChild(btn);
  });
  updateTracker();
}

async function onPick(i, btn){
  if(state.taken[i]) return;

  const revealed = state.mapping[i];

  btn.classList.add('opened');
  const card = btn.querySelector('.name-card');

  const result = await runTransaction(gameRef, (current) => {
    if(current === null) return current;
    if(current.taken[i]) return;

    const newState = {
      mapping: current.mapping.slice(),
      taken:   current.taken.slice(),
      opened:  current.opened.slice(),
      names:   current.names.slice()
    };

    const pickedName = current.mapping[i];
    newState.opened[i] = true;
    newState.taken[i]  = true;
    newState.names     = newState.names.filter(n => n !== pickedName);
    newState.mapping   = buildMapping(newState.names, newState.taken);

    return newState;
  });

  if(!result.committed){
    btn.classList.remove('opened');
    setStatus("That envelope was just taken by someone else — pick another!", true);
    return;
  }

  if(revealed){
    card.querySelector('.n').textContent = revealed;
    card.setAttribute('aria-hidden','false');

    // ✨ POP: confetti + firework burst at envelope + golden glow across screen
    burst(btn, PALETTE[i].hex);
    if(window.ChristmasFX) window.ChristmasFX.popAt(btn);

    const glow = document.createElement('div');
    glow.className = 'golden-glow';
    document.body.appendChild(glow);
    setTimeout(()=> glow.remove(), 1500);
  }

  setTimeout(()=>{
    btn.classList.add('taken');
    if(revealed) setStatus(`${PALETTE[i].label} opened — “${revealed}” removed from the pool.`, true);
  }, 650);
}

async function connect(){
  await seedIfEmpty();
  onValue(gameRef, (snap)=>{
    const v = snap.val();
    if(!v) return;

    const prevTaken = state.taken.filter(Boolean).length;
    state = {
      mapping: v.mapping || [null,null,null,null],
      taken:   v.taken   || [false,false,false,false],
      opened:  v.opened  || [false,false,false,false],
      names:   v.names   || NAMES.slice()
    };
    render();

    const totalTaken = state.taken.filter(Boolean).length;
    if(totalTaken >= 4){
      setStatus("All four envelopes opened. Merry Christmas! 🎁", true);
      if(prevTaken < 4 && window.ChristmasFX){
        window.ChristmasFX.finale();
        setTimeout(()=> window.ChristmasFX.finale(), 900);
      }
    } else if(totalTaken === 0){
      setStatus("Names are hidden and shuffled. Tap an envelope to reveal.", false);
    } else if(totalTaken > prevTaken){
      setStatus("A name was just revealed by someone else — good luck!", true);
      // celebratory burst in the middle of the screen so all viewers see it
      if(window.ChristmasFX){
        window.ChristmasFX.bigBurst(window.innerWidth/2, window.innerHeight/2);
      }
    }
    btnShuffle.disabled = totalTaken >= 4;
  });
}

async function reshuffle(){
  if(state.taken.filter(Boolean).length >= 4){
    setStatus("All envelopes are taken — nothing left to shuffle. 🎄", true);
    return;
  }
  await runTransaction(gameRef, (current) => {
    if(current === null) return current;
    return {
      ...current,
      opened:  [false,false,false,false],
      mapping: buildMapping(current.names.slice(), current.taken.slice())
    };
  });
  setStatus("Fresh shuffle — names hidden again. Pick an envelope!", true);
  document.querySelectorAll('.env:not(.taken)').forEach((e,i)=>{
    e.animate(
      [{transform:'translateY(0) rotate(0)'},
       {transform:'translateY(-8px) rotate(-1.5deg)'},
       {transform:'translateY(0) rotate(0)'}],
      {duration:460, delay:i*70, easing:'ease-in-out'}
    );
  });
}

function burst(el, color){
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const colors = [color,'#ffd966','#fff7ea','#e6c87a','#c0262f','#1f6b3a'];
  for(let i=0;i<30;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    const size = 6 + Math.random()*7;
    c.style.width = size+'px'; c.style.height = size+'px';
    c.style.left = cx+'px'; c.style.top = cy+'px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius = Math.random()>.5 ? '50%' : '2px';
    c.style.setProperty('--x',(Math.random()*300-150)+'px');
    c.style.setProperty('--y',(Math.random()*-260-40)+'px');
    c.style.setProperty('--r',(Math.random()*720-360)+'deg');
    c.style.animationDuration = (0.9+Math.random()*1.0)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 2200);
  }
}

btnShuffle.addEventListener('click', reshuffle);
connect().catch(err=>{
  console.error(err);
  setStatus("⚠️ Couldn't connect to Firebase. Check your config in the code.", false);
});
</script>
